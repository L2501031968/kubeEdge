# 测试环境的 Amarisoft 占位工作负载。
# 使用 kind 节点内已经预置的 pause 镜像，避免额外拉取镜像；requests/limits 与
# 真实环境的量级保持一致，便于观察调度与资源占用。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amari-core
  namespace: amari-d2000
  labels:
    app: amari-core
    kb.local/sim: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amari-core
  template:
    metadata:
      labels:
        app: amari-core
    spec:
      nodeSelector:
        kb.local/name: d2000-edge
      tolerations:
        - key: kb.local/edge
          operator: Exists
          effect: NoSchedule
      containers:
        - name: main
          image: registry.k8s.io/pause:3.9
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 300m
              memory: 256Mi
            limits:
              cpu: 600m
              memory: 512Mi
